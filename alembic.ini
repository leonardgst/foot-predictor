[alembic]
script_location = migrations
prepend_sys_path = src

# L'URL est fixée dynamiquement dans migrations/env.py à partir de
# la variable d'environnement APP_ENV (dev / test / prod).
# Ne rien mettre ici pour éviter d'y coder en dur des identifiants.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S