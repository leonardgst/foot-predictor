name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Base de test éphémère, recréée à chaque exécution (décision M14).
    # Identifiants propres à la CI, sans valeur hors de ce conteneur.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fp_ci
          POSTGRES_PASSWORD: fp_ci
          POSTGRES_DB: foot_predictor_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fp_ci -d foot_predictor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Lues par config.py (pydantic-settings) à défaut de fichier .env.test.
    env:
      APP_ENV: test
      POSTGRES_USER: fp_ci
      POSTGRES_PASSWORD: fp_ci
      POSTGRES_DB: foot_predictor_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      FP_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff (contrôle et formatage)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrations (base de test du service)
        run: uv run alembic upgrade head

      - name: Tous les tests, base comprise
        run: uv run pytest --cov=src/foot_predictor --cov-report=term-missing
