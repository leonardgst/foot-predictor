name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests without database (pytest -m "not db")
        run: uv run pytest -m "not db" --cov=src/foot_predictor --cov-report=term-missing
