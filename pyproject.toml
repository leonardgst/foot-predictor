[project]
name = "foot-predictor"
version = "0.1.0"
description = "Prédire la distribution du nombre de buts d'un match de football (top 5 européen), avec une application locale qui explique chaque prédiction."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "requests==2.32.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foot_predictor"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.9",
]
# Notebooks d'exploration (partie 3, sous-étape 3.8 ; ADR-0034) :
#   ipykernel  : noyau Python des notebooks (VS Code, nbclient) ; sans lui, aucun notebook ne s'exécute ;
#   matplotlib : graphiques ; pandas les délègue à matplotlib, l'alternative plus légère n'existe pas ;
#   nbclient   : exécute un notebook sans interface (vérifier qu'il tourne de bout en bout) ;
#   nbformat   : lit et écrit les .ipynb (dépendance de nbclient, déclarée parce qu'on l'importe).
explo = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: test nécessitant une vraie base Postgres (APP_ENV=test, docker-compose port 5433). Exclure avec -m \"not db\" si aucune base n'est disponible.",
    "raw: test qui lit le vrai brut (FP_RAW_DIR, FP_EXTERNAL_RAW_DIR) ; sauté ailleurs, jamais en CI.",
]

# ruff : contrôle et formatage (rapport de cadrage B.7 et J.2).
[tool.ruff]
line-length = 120
target-version = "py311"
# Chemins gelés jusqu'à la session de gel du 19 octobre (partie 2, règles du gel) :
# le code du collecteur, du brut et des tâches planifiées ne change pas avant.
# Les fichiers ajoutés dans ces dossiers (collect/football_data/...) sont contrôlés.
# force-exclude : l'exclusion vaut aussi quand pre-commit passe les fichiers un à un.
force-exclude = true
extend-exclude = [
    "src/foot_predictor/collect/__init__.py",
    "src/foot_predictor/collect/api_football",
    "src/foot_predictor/rawstore",
    "src/foot_predictor/quality/raw_check.py",
    "scripts/taches_planifiees",
    "tests/collect/__init__.py",
    "tests/collect/api_football",
    "tests/rawstore",
    "tests/quality",
    "tests/test_taches_planifiees.py",
    # Migrations déjà appliquées : jamais réécrites, même pour le formatage (partie 2, 2.4).
    "migrations/versions/0001_create_schemas.py",
    "migrations/versions/0002_create_tables.py",
    "migrations/versions/0003_market_value_score.py",
]

[tool.ruff.lint]
# E, W : style (pycodestyle) ; F : erreurs (pyflakes) ; I : ordre des imports ;
# UP : syntaxe Python 3.11 ; B : pièges courants (bugbear).
select = ["E", "W", "F", "I", "UP", "B"]
# E501 : longueurs gérées par le formateur ; les longues chaînes restent lisibles.
# B905 : `zip(strict=...)` explicite partout, du bruit sans gain ici.
ignore = ["E501", "B905"]
