  # --- France : Ligue 1 (61), Ligue 2 (62) ---
  # 2019-20 : championnats arrêtés en mars 2020, sans reprise ; les matchs de début mars ont eu un public.
  - leagues: [61, 62]
    start: 2020-08-21
    end: 2020-10-29
    status: jauge_reduite
