[project]
name = "foot-predictor"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "hdbscan>=0.8.44",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "requests==2.32.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.15.0",
    "understatapi>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foot_predictor"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: test nécessitant une vraie base Postgres (APP_ENV=test, docker-compose port 5433). Exclure avec -m \"not db\" si aucune base n'est disponible.",
]
